# LuckPerms metrics: groups, tracks, player distribution.
#
# One jar, one integration. Removing it removes these metrics and nothing
# else; if it crashes, it crashes alone. That's what "depend" guarantees:
# without the core or without LuckPerms, Bukkit doesn't load this plugin and
# says so clearly, instead of letting a collector fail silently on every scrape.
#
# The description is quoted, and that's not decorative: it contains a ": "
# (colon followed by a space), which turns a bare string into a YAML
# key-value pair. Without the quotes, Paper rejects the whole file —
# "Error loading plugin: Invalid plugin.yml" — without saying which or why.
name: VaniaMetrics-LuckPerms
version: ${version}
main: fr.samflix.vaniametrics.module.luckperms.LuckPermsPaper
api-version: '1.21'
authors: [mc-vania]
description: "LuckPerms metrics: groups, tracks, player distribution."
depend: [VaniaMetrics, LuckPerms]
